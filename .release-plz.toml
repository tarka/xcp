[workspace]
features_always_increment_minor = true

[changelog]

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^improv", group = "<!-- 1 -->Improvements" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^perf", group = "<!-- 5 -->Performance" },
  { message = "^style", group = "<!-- 6 -->Styling" },
  { message = "^test", group = "<!-- 7 -->Testing" },

  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci|^maint", group = "<!-- 8 -->Miscellaneous Tasks" },

  { body = ".*security", group = "<!-- 9 -->Security" },
  { message = "^sec", group = "<!-- 9 -->Security" },
  { message = "^revert", group = "<!-- 10 -->Revert" },
  { message = "^.*", group = "other" },
]
